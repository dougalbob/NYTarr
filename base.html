<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NYTarr</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background:#1e1e2e; color:#cdd6f4; }
  header { background:#181825; padding: 12px 20px; border-bottom: 1px solid #313244; }
  header h1 { margin:0; font-size: 20px; color:#89b4fa; }
  nav { margin-top: 8px; }
  nav a { color:#cdd6f4; text-decoration:none; margin-right:16px; padding:4px 8px; border-radius:4px; }
  nav a:hover { background:#313244; }
  main { padding: 20px; max-width: 1000px; margin: 0 auto; }
  table { width:100%; border-collapse: collapse; background:#181825; border-radius:6px; overflow:hidden; }
  th, td { padding: 10px 14px; text-align:left; border-bottom: 1px solid #313244; }
  th { background:#313244; }
  .status-completed { color:#a6e3a1; font-weight:600; }
  .status-downloading { color:#f9e2af; }
  .status-searching { color:#89dceb; }
  .status-failed { color:#f38ba8; }
  form label { display:block; margin-top: 12px; font-weight:600; }
  form input, form select { width: 100%; padding: 8px; margin-top: 4px; background:#313244; color:#cdd6f4; border:1px solid #45475a; border-radius:4px; box-sizing:border-box; }
  button, .btn { background:#89b4fa; color:#1e1e2e; padding:10px 18px; border:none; border-radius:4px; cursor:pointer; font-weight:600; text-decoration:none; display:inline-block; margin-top:12px; }
  button:hover, .btn:hover { background:#74c7ec; }
  .flash { padding:10px; margin-bottom:12px; border-radius:4px; }
  .flash.success { background:#a6e3a1; color:#1e1e2e; }
  .flash.error { background:#f38ba8; color:#1e1e2e; }
  pre { background:#181825; padding:12px; border-radius:6px; overflow-x:auto; max-height:70vh; overflow-y:auto; font-size:12px; }
  .section { background:#181825; padding:16px; border-radius:6px; margin-bottom:16px; }
</style>
</head>
<body>
<header>
  <h1>📰 NYTarr</h1>
  <nav>
    <a href="{{ url_for('index') }}">History</a>
    <a href="{{ url_for('settings') }}">Settings</a>
    <a href="{{ url_for('logs') }}">Logs</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash {{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
